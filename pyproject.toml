[project]
name = "planetary-ai-tessera-kenya"
version = "0.1.0"
description = "Mapping Kenya with TESSERA satellite embeddings — coverage audit, strategy and experiments"
readme = "README.md"
# geotessera 0.9.0 requires Python >= 3.12; on 3.11 pip silently falls back to
# 0.7.5, which lacks `dataset_variant` and breaks K.client().
requires-python = ">=3.12"
dependencies = [
    "geotessera==0.9.0",   # the TESSERA client — src/kenya.py
    "numpy>=1.26",
    "pandas>=2.0",
    "geopandas>=1.0",
    "shapely>=2.0",
    "rasterio>=1.3",
    "matplotlib>=3.8",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
    "nbclient>=0.11.0",
    "nbconvert>=7.16",
]

[tool.uv]
package = false
